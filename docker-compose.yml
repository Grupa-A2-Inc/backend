services:
  db:
    image: postgres:15-alpine
    container_name: tutor-db
    environment:
      POSTGRES_DB: adaptive_tutor
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      # Mapam scriptul ca să creeze a doua bază de date la prima pornire
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d adaptive_tutor"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tutor-backend
    ports:
      - "8067:8067"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SERVER_PORT=8067
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/adaptive_tutor
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_FLYWAY_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - MAIL_HOST
      - MAIL_PORT
      - MAIL_USERNAME
      - MAIL_PASSWORD
      - MAIL_FROM
      - APP_FRONTEND_URL=http://localhost:3000

      - AI_API_BASE_URL
      - AI_API_KEY