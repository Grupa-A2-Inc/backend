name: Deploy Backend to K3s

on:
  push:
    branches:
      - deploy

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, elearnserver]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t lyochris/elearning-backend:${{ github.sha }} \
            -t lyochris/elearning-backend:latest \
            .

      - name: Push Docker image
        run: |
          docker push lyochris/elearning-backend:${{ github.sha }}
          docker push lyochris/elearning-backend:latest

      - name: Deploy new image to Kubernetes
        run: |
          kubectl set image deployment/elearning-backend \
            elearning-backend=lyochris/elearning-backend:${{ github.sha }} \
            -n elearning

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/elearning-backend -n elearning --timeout=180s

      - name: Rollback if deployment failed
        if: failure()
        run: |
          kubectl rollout undo deployment/elearning-backend -n elearning
          kubectl rollout status deployment/elearning-backend -n elearning --timeout=180s
