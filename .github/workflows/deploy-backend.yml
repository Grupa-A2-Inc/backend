name: Deploy Frontend to K3s

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    env:
      KUBECONFIG: /home/lyo/.kube/config
      DOCKER_CONFIG: /tmp/docker-config-${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Docker config
        run: |
          rm -rf "$DOCKER_CONFIG"
          mkdir -p "$DOCKER_CONFIG"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t lyochris/elearning-frontend:${{ github.sha }} \
            -t lyochris/elearning-frontend:latest \
            .

      - name: Push Docker image
        run: |
          docker push lyochris/elearning-frontend:${{ github.sha }}
          docker push lyochris/elearning-frontend:latest

      - name: Deploy new image to Kubernetes
        run: |
          kubectl set image deployment/elearning-frontend \
            elearning-frontend=lyochris/elearning-frontend:${{ github.sha }} \
            -n elearning

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/elearning-frontend -n elearning --timeout=180s

      - name: Rollback if deployment failed
        if: failure()
        run: |
          kubectl rollout undo deployment/elearning-frontend -n elearning || true
          kubectl rollout status deployment/elearning-frontend -n elearning --timeout=180s || true

      - name: Clean Docker config
        if: always()
        run: |
          rm -rf "$DOCKER_CONFIG"
