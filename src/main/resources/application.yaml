spring:
  config:
    import: optional:file:.env
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  #  datasource:
  #    url: jdbc:postgresql://localhost:5432/adaptive_tutor
  #    username: user
  #    password: password
  flyway:
    enabled: true
    repair-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8067}
#  port: 8067

app:
  mail:
    from: ${MAIL_FROM}

ai:
  api:
    base-url: ${AI_API_BASE_URL}
    key: ${AI_API_KEY}
    timeout-generate-ms: 10000
    timeout-feedback-ms: 5000
    timeout-adaptive-ms: 10000