spring:
  config:
    import: optional:file:.env
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  #  datasource:
  #    url: jdbc:postgresql://localhost:5432/adaptive_tutor
  #    username: user
  #    password: password
  flyway:
    enabled: true
    repair-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8067}
#  port: 8067

app:
  mail:
    from: ${MAIL_FROM}

ai:
  api:
    base-url: ${AI_API_BASE_URL}
    key: ${AI_API_KEY}
    timeout-generate-ms: 60000
    timeout-feedback-ms: 5000
    timeout-adaptive-ms: 600000
    timeout-student-registration-ms: 5000

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

crypto:
  rpc-url: ${WEB3_RPC_URL}
  private-key: ${PLATFORM_PRIVATE_KEY}
  chain-id: ${WEB3_CHAIN_ID:11155111}

  tai-coin-address: ${TAI_COIN_ADDRESS:0xb2981064099c348F4Dc79686836Bb45ec4CccdFD}
  tai-engine-address: ${TAI_ENGINE_ADDRESS:0x6cCF7d4197F93Ecd2431653657e9c105f30A8a74}
  eurc-address: ${EURC_ADDRESS}

  gas-price-wei: ${WEB3_GAS_PRICE_WEI:5000000000}
  gas-limit: ${WEB3_GAS_LIMIT:1500000}

stablecoin:
  provider: ${STABLECOIN_PROVIDER:circle}
  enabled: ${STABLECOIN_ENABLED:false}
  sepolia-mock-payments-enabled: ${SEPOLIA_MOCK_PAYMENTS_ENABLED:true}
  sepolia-realistic-funding-enabled: ${SEPOLIA_REALISTIC_FUNDING_ENABLED:false}
  sepolia-fallback-to-mock-enabled: ${SEPOLIA_FALLBACK_TO_MOCK_ENABLED:true}
  sepolia-funding-wait-attempts: ${SEPOLIA_FUNDING_WAIT_ATTEMPTS:6}
  sepolia-funding-wait-ms: ${SEPOLIA_FUNDING_WAIT_MS:5000}
  circle:
    api-base-url: ${CIRCLE_API_BASE_URL:https://api.circle.com}
    api-key: ${CIRCLE_API_KEY:}
    source-wallet-id: ${CIRCLE_SOURCE_WALLET_ID:}
    eurc-token-id: ${CIRCLE_EURC_TOKEN_ID:}
    platform-wallet-address: ${PLATFORM_WALLET_ADDRESS:}
    faucet-enabled: ${CIRCLE_FAUCET_ENABLED:false}
    faucet-blockchain: ${CIRCLE_FAUCET_BLOCKCHAIN:ETH-SEPOLIA}
