JWT_SECRET: your-secret-here-at-least-32-bites

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/adaptive_tutor_test
    username: user
    password: password
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 25
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  file:
    name: app.log
  level:
    root: INFO

app:
  mail:
    from: test@example.com

ai:
  api:
    base-url: "http://localhost:8080"
    key: "test-key"
    timeout-generate-ms: 10000
    timeout-feedback-ms: 5000
    timeout-adaptive-ms: 10000
